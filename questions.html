<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Questions For Ammu ❤️</title>

<style>

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#080808,#1a1a1a);
font-family:Poppins,sans-serif;
color:white;
}

.card{
width:90%;
max-width:700px;

background:
rgba(255,255,255,.05);

backdrop-filter:blur(20px);

padding:40px;

border-radius:25px;

border:1px solid rgba(255,255,255,.1);
}

h1{
text-align:center;
margin-bottom:30px;
}

label{
display:block;
margin-top:25px;
font-size:1rem;
}

textarea{
width:100%;
height:120px;

margin-top:10px;

background:
rgba(255,255,255,.08);

border:none;

border-radius:15px;

padding:15px;

color:white;
resize:none;
}

button{
width:100%;
margin-top:30px;

padding:18px;

border:none;

border-radius:50px;

font-size:1rem;

cursor:pointer;

background:
linear-gradient(
135deg,
#ff8fab,
#fb6f92
);

color:white;
}

</style>

</head>

<body>

<div class="card">

<h1>Dear Ammu ❤️</h1>

<script>
const form = document.getElementById("loveForm");

form.addEventListener("submit", function () {
    setTimeout(() => {
        window.location.href = "poem.html";
    }, 1500);
});
</script>

<label>

How can I reassure you when you're feeling anxious or overthinking?

</label>

<textarea
name="Question 1"
required></textarea>

<label>

When do you feel closest to me?

</label>

<textarea
name="Question 2"
required></textarea>

<label>

When you picture our life together someday,
what does it look like?

</label>

<textarea
name="Question 3"
required></textarea>

<button type="submit">

Send To Your Baby ❤️

</button>

</form>

</div>

</body>
</html>
