<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Kisho ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:radial-gradient(circle at top,#2b0d1f,#050505);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
text-align:center;
z-index:2;
padding:40px;
}

h1{
font-size:4rem;
margin-bottom:20px;
background:linear-gradient(45deg,#ff8fab,#ffd6a5);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
font-size:1.2rem;
opacity:.8;
max-width:600px;
margin:auto;
line-height:1.8;
}

button{
margin-top:40px;
padding:18px 45px;
background:linear-gradient(135deg,#ff8fab,#fb6f92);
border:none;
border-radius:50px;
color:white;
font-size:1rem;
cursor:pointer;
transition:.3s;
box-shadow:0 0 30px rgba(255,143,171,.4);
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
font-size:30px;
animation:float linear infinite;
opacity:.7;
}

@keyframes float{

from{
transform:translateY(120vh);
}

to{
transform:translateY(-20vh);
}

}

.glow{
position:absolute;
width:500px;
height:500px;
background:#fb6f92;
filter:blur(200px);
opacity:.15;
}

</style>

</head>

<body>

<div class="glow"></div>

<div class="container">

<h1>Kisho ❤️</h1>

<div class="subtitle">

Hey Ammu...

<br><br>

I made something special for you.

Not because I had to.

Because you're worth every second.

<br><br>

Love,
Your Baby ❤️

</div>

<button onclick="window.location.href='questions.html'">

Open My Surprise ✨

</button>

</div>

<script>

for(let i=0;i<50;i++){

let heart=document.createElement("div");

heart.innerHTML="❤️";

heart.className="heart";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=
(15+Math.random()*35)+"px";

heart.style.animationDuration=
(6+Math.random()*10)+"s";

document.body.appendChild(heart);

}

</script>

</body>
</html>
``
